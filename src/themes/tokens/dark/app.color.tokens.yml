# Dark-mode overrides for app brand / surface colors
color:
  # Avoid pure black — softer charcoal page background
  essential:
    value: '#202020'
    comment: 'background color'

  project:
    value: '#4d8cff'

  # UI-kit lightens project for selection; that yields near-white and
  # makes white text unreadable. Use a translucent project tint instead.
  fillColor:
    selection:
      value: 'color({color.project.value} a(22%))'

  typo:
    primary:
      value: '#fff'
      comment: 'Primary color for all text'
    secondary:
      value: 'rgba(255, 255, 255, 0.65)'
      comment: 'Used for descriptions'
    alert:
      value: '#ff6b6b'
